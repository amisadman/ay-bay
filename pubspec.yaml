name: aybay_flutter
description: "AyBay - Income, Expense, Loan & Debt Manager with Walleo AI Agent"
publish_to: 'none'
version: 1.1.17
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  lottie: ^3.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.1
  u_credit_card: ^1.6.0
  url_launcher: ^6.3.2
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.3
  permission_handler: ^11.3.1
  file_picker: ^8.1.0
  flare_flutter: ^3.0.2
  crypto: ^3.0.7
  image_picker: ^1.2.1
  local_auth: ^2.3.0
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  speech_to_text: ^7.4.0
  animated_text_kit: ^4.3.0
  csv: ^6.0.0
  uuid: ^4.6.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/aybay-logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/animations/

